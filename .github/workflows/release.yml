name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write # close the release's milestone
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Builds FadeUI-<tag>.zip, attaches it to a GitHub release, and uploads it to
      # CurseForge (project ID from FadeUI.toc) when the CF_API_KEY secret is set.
      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      # The packager fills the release body with whole commit messages. Replace it with
      # GitHub's list of the release's PRs (grouped by label, see .github/release.yml),
      # then close the milestone named after the tag.
      - name: Release notes and milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f previous_tag_name="$prev" --jq .body > notes.md
          gh release edit "$TAG" --notes-file notes.md
          number=$(gh api "repos/$GITHUB_REPOSITORY/milestones" --jq ".[] | select(.title == \"$TAG\") | .number")
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$number" -f state=closed
          fi
