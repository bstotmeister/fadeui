name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write # close the release's milestone
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CHANGELOG.md lists the tag's PRs, grouped by label (.github/release.yml). The
      # packager uses it as the release notes (manual-changelog in .pkgmeta).
      - name: Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/changelog.sh "$GITHUB_REF_NAME"

      # Builds FadeUI-<tag>.zip, attaches it to a GitHub release, and uploads it to
      # CurseForge (project ID from FadeUI.toc) when the CF_API_KEY secret is set.
      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Close milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          number=$(gh api "repos/$GITHUB_REPOSITORY/milestones" --jq ".[] | select(.title == \"$TAG\") | .number")
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$number" -f state=closed
          fi
